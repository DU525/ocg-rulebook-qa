user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  canary  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'upstream=$upstream_addr rt=$request_time '
                        'canary=$upstream_http_x_canary_version';

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  canary;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Cookie-based canary routing
    map $cookie_canary $canary_from_cookie {
        default     "stable";
        canary      "canary";
        enable      "canary";
        test        "canary";
    }

    # Header-based canary routing
    map $http_x_canary $canary_from_header {
        default     "stable";
        canary      "canary";
        true        "canary";
        enable      "canary";
    }

    # User-Agent based canary routing (for automated testing)
    map $http_user_agent $canary_from_user_agent {
        default     "stable";
        ~*CanaryTest    "canary";
        ~*CanaryBot     "canary";
    }

    # Combined canary decision
    map "$canary_from_cookie:$canary_from_header:$canary_from_user_agent" $final_canary_backend {
        ~*:canary:*     "canary_backend";
        ~*::canary:*    "canary_backend";
        ~*:::canary     "canary_backend";
        default         "stable_backend";
    }

    # Stable backend (production version)
    upstream stable_backend {
        server 127.0.0.1:5001;
        keepalive 32;
    }

    # Canary backend (new version for testing)
    upstream canary_backend {
        server 127.0.0.1:5002;
        keepalive 32;
    }

    # Weight-based traffic splitting (90% stable, 10% canary)
    upstream backend_pool {
        server 127.0.0.1:5001 weight=9;
        server 127.0.0.1:5002 weight=1;
    }

    # Random-based canary assignment using split_clients
    split_clients "${remote_addr}${http_user_agent}${date_gmt}" %canary {
        10%     canary;
        *       stable;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static frontend assets
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        # Cached static assets
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API routing with canary support
        location /api/ {
            set $backend "backend_pool";

            # Cookie-based routing takes highest priority
            if ($canary_from_cookie = "canary") {
                set $backend "canary_backend";
            }

            # Header-based routing
            if ($canary_from_header = "canary") {
                set $backend "canary_backend";
            }

            # User-Agent based routing
            if ($canary_from_user_agent = "canary") {
                set $backend "canary_backend";
            }

            # Random percentage-based routing (fallback)
            if ($%canary = "canary") {
                set $backend "canary_backend";
            }

            proxy_pass http://$backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;

            # Response headers for debugging
            add_header X-Upstream-Backend $backend;
            add_header X-Canary-Routing "%canary";
            add_header X-Canary-Cookie $canary_from_cookie;
            add_header X-Canary-Header $canary_from_header;
        }

        # Metrics endpoint (always route to stable)
        location /metrics {
            proxy_pass http://stable_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (load balanced)
        location /health {
            proxy_pass http://backend_pool/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Grafana proxy (always stable)
        location /grafana/ {
            proxy_pass http://stable_backend/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus proxy (always stable)
        location /prometheus/ {
            proxy_pass http://stable_backend/prometheus/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
