version: '3.8'

services:
  # ========================================
  # Nginx 反向代理（统一入口）
  # ========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ocg-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Nginx Reverse Proxy"

  # ========================================
  # 前端服务（Nginx 静态文件服务）
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      target: production
    container_name: ocg-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Frontend SPA (React + Vite)"

  # ========================================
  # 后端服务（Flask API）
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      target: production
    container_name: ocg-backend
    expose:
      - "5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=false
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_API_BASE=${MINIMAX_API_BASE:-https://api.minimaxi.com/v1/text/chatcompletion_v2}
      - MODEL_NAME=${MODEL_NAME:-MiniMax-M2.7}
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4}
      - FALLBACK_PROVIDER=${FALLBACK_PROVIDER:-minimax}
      - FALLBACK_API_KEY=${FALLBACK_API_KEY:-}
      - FALLBACK_API_BASE=${FALLBACK_API_BASE:-https://api.minimaxi.com/v1}
      - FALLBACK_MODEL_NAME=${FALLBACK_MODEL_NAME:-abab6.5s-chat}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - STREAMING_ENABLED=${STREAMING_ENABLED:-false}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - MAX_TOKENS=${MAX_TOKENS:-1500}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-5}
      - FEISHU_ENABLED=${FEISHU_ENABLED:-false}
      - FEISHU_BOT_TOKEN=${FEISHU_BOT_TOKEN:-}
      - FEISHU_CHAT_ID=${FEISHU_CHAT_ID:-}
      - FEISHU_USER_ID=${FEISHU_USER_ID:-}
      - REDIS_URL=redis://redis:6379/0
      - MONITORING_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./data/ocg_chroma_db:/app/data/ocg_chroma_db
      - ./data/dm_chroma_db:/app/data/dm_chroma_db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Backend API (Flask + RAG)"

  # ========================================
  # Redis 缓存服务
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: ocg-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Redis Cache"

  # ========================================
  # Prometheus 监控
  # ========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ocg-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Prometheus Metrics Collection"

  # ========================================
  # Grafana 可视化监控
  # ========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: ocg-grafana
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost/grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ocg-network
    labels:
      - "com.docker.compose.description=Grafana Dashboards"

# ========================================
# 网络与卷定义
# ========================================
networks:
  ocg-network:
    driver: bridge
    name: ocg-network

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
