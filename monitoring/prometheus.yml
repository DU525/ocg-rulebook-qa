global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ocg-rulebook-monitor'

rule_files:
  - "alert_rules.yml"
  - "slo_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ocg-backend'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ocg-backend-1'
